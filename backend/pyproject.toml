[project]
name = "shelfsense"
version = "0.1.0"
description = "ShelfSense — twin-store retail waste simulation (FoodSphere AI domain)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=2.0",
    "httpx>=0.27",
    "google-genai>=3.3.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
seed = [
    "pandas>=3.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
